name: Retrain and monitor

on:
  schedule:
    - cron: "0 2 * * 1"   # every Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Retrain model (logs to MLflow)
        run: python -m src.train
      - name: Log precision/recall per window
        run: python -m src.monitor
      - uses: actions/upload-artifact@v4
        with:
          name: model-and-metrics
          path: |
            models/
            data/metrics_history.csv
      - name: Commit metrics history for the dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f data/metrics_history.csv
          git diff --cached --quiet || git commit -m "chore: update metrics history"
          git push
